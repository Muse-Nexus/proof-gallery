name: Feature request
description: Propose a narrow, privacy-preserving improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Never include real evidence or private account details. Automatic collection, public galleries, diagnosis, distress-triggered surfacing, and worth scoring are outside the MVP.
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What concrete owner-controlled outcome would improve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Privacy and safety boundary
      description: How does this remain private, source-faithful, and user-initiated?
    validations:
      required: true
