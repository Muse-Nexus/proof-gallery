name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy warning:** never paste real evidence, names, photos, credentials, JWTs, signed URLs, project identifiers, or production logs. Use explicitly synthetic examples.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior with synthetic data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact commit SHA or release.
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains synthetic data only and no secrets or personal evidence.
          required: true
