name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-companion:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Test the synthetic companion format
        working-directory: companion/macos
        run: swift test
      - name: Build and verify the local app bundle
        working-directory: companion/macos
        run: bash build-app.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.23

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: bun run check

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14

      - name: Check Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno check supabase/functions/proof-search/index.ts
          deno check supabase/functions/embed-proof/index.ts

      - name: Reject committed private configuration
        run: |
          test ! -n "$(git ls-files '.env*' ':!.env.example')"
          ! git grep -InE '(cmcp_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!bun.lock' ':!deno.lock'

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.23

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.84.2

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Verify grants and two-owner behavior
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          psql "$DB_URL" -f tests/integration/grants.sql
          bun run test:integration:local

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
